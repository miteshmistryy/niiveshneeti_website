  <style>
    :root {
      --color-bg: #fdfcfb;
      --color-surface: #ffffff;
      --color-border: #e2e8f0;
      --color-text: #0f172a;
      --color-muted: #64748b;
      --color-primary: #06b6d4; /* cyan */
      --color-primary-alt: #22c55e; /* green */
      --color-accent-pink: #fb7185;
      --color-accent-purple: #a855f7;
      --color-accent-yellow: #facc15;
      --font-body: "Satoshi", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      --radius-lg: 1rem;
      --radius-xl: 1.5rem;
      --shadow-soft: 0 16px 40px rgba(15, 23, 42, 0.08);
      --shadow-strong: 0 30px 80px rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: radial-gradient(circle at top left, #fdf2ff 0, #fdfcfb 40%, #ecfeff 100%);
      color: var(--color-text);
      overflow-x: hidden;
      line-height: 1.6;
    }

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #e5e7eb;
    }

    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 6px;
    }

    .nav-link {
      color: #334155;
      font-weight: 700;
      font-size: 0.94rem;
      transition: color 0.2s ease, transform 0.2s ease;
      text-decoration: none;
    }

    .nav-link:hover {
      color: var(--color-primary);
      transform: translateY(-1px);
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #06b6d4, #22c55e);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 18px 38px rgba(34, 197, 94, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .cta-btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 24px 48px rgba(34, 197, 94, 0.42);
      opacity: 0.98;
    }

    .secondary-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 8px;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .secondary-btn:hover {
      color: var(--color-primary);
      transform: translateX(3px);
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border: 1px solid rgba(15, 23, 42, 0.06);
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
    }

    .hero-pad {
      padding-top: 5rem;
      padding-bottom: 5.5rem;
    }

    .card {
      background: var(--color-surface);
      border-radius: 24px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -120% auto auto -56%;
      width: 220px;
      height: 260%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.5),
        transparent
      );
      transform: rotate(18deg);
      opacity: 0;
      transition: opacity 0.4s ease, transform 1.1s ease;
      pointer-events: none;
    }

    .card:hover::before {
      opacity: 1;
      transform: translateX(640px) rotate(18deg);
    }

    .section-alt {
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.8),
        rgba(248, 250, 252, 0.96)
      );
    }

    .reveal {
      opacity: 0;
      transform: translateY(26px) scale(0.98);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .reveal.from-left {
      transform: translateX(-32px);
    }

    .reveal.from-right {
      transform: translateX(32px);
    }

    .reveal.visible {
      opacity: 1;
      transform: none;
    }

    .delay-1 {
      transition-delay: 0.08s;
    }

    .delay-2 {
      transition-delay: 0.16s;
    }

    .delay-3 {
      transition-delay: 0.24s;
    }

    .delay-4 {
      transition-delay: 0.32s;
    }

    .delay-5 {
      transition-delay: 0.4s;
    }

    .delay-6 {
      transition-delay: 0.48s;
    }

    .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      position: relative;
    }

    .icon-box-gradient {
      background: radial-gradient(circle at top left, #cffafe, #fef3c7);
      color: #0f172a;
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    .icon-bob {
      animation: bob 3.8s ease-in-out infinite;
    }

    .ticker-card {
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.9),
        rgba(248, 250, 252, 0.96)
      );
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    .pricing-popular {
      border-radius: 26px;
      background: radial-gradient(circle at top left, #ecfeff, #fefce8);
      border: 2px solid var(--color-primary-alt);
      box-shadow: var(--shadow-strong);
      position: relative;
    }

    /* HERO RIGHT: ADVANCED ADVISORY NOTIFICATION + CHART */
    .hero-visual {
      position: relative;
      max-width: 420px;
      width: 100%;
      margin-left: auto;
    }

    .hero-glow {
      position: absolute;
      inset: -40px -80px auto auto;
      background: radial-gradient(circle at top right, #f9a8d4 0, transparent 55%);
      opacity: 0.9;
      pointer-events: none;
      filter: blur(40px);
      z-index: 0;
    }

    .notif-shell {
      position: relative;
      border-radius: 28px;
      background: radial-gradient(circle at top left, #ecfeff 0, #ffffff 45%, #fef9c3 100%);
      padding: 22px 22px 18px;
      box-shadow: var(--shadow-strong);
      border: 1px solid rgba(148, 163, 184, 0.32);
      z-index: 2;
    }

    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .notif-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .notif-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 800;
      color: #0f172a;
    }

    .notif-tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.35);
      animation: pulseDot 1.8s ease-out infinite;
    }

    @keyframes pulseDot {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    .notif-title {
      font-weight: 900;
      font-size: 1.02rem;
      color: #0f172a;
    }

    .notif-badge {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 10px;
      color: #64748b;
    }

    .notif-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.92);
      border: 1px dashed rgba(148, 163, 184, 0.6);
    }

    .notif-pill-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 8px;
    }

    .notif-main {
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: radial-gradient(circle at top, #f0f9ff 0, #ffffff 35%, #fefce8 100%);
      padding: 14px 14px 12px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .notif-stage-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .notif-stage-text {
      font-size: 0.82rem;
      color: #475569;
      line-height: 1.6;
    }

    .notif-meta-list {
      list-style: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      color: #0f172a;
    }

    .notif-meta-list li span {
      font-weight: 700;
      color: #0f172a;
    }

    .notif-chip-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .notif-chip {
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background-color: rgba(255, 255, 255, 0.9);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #0f172a;
      font-weight: 700;
    }

    .notif-chip i {
      font-size: 11px;
    }

    .hero-chart {
      position: relative;
      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(6, 182, 212, 0.07),
        rgba(34, 197, 94, 0.08)
      );
      border: 1px dashed rgba(148, 163, 184, 0.6);
      padding: 10px 10px 8px;
      overflow: hidden;
    }

    .hero-chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 10px;
      color: #64748b;
    }

    .hero-chart-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #0f172a;
    }

    .hero-chart-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #06b6d4;
      box-shadow: 0 0 0 6px rgba(6, 182, 212, 0.4);
      animation: pulseDot 2.3s ease-out infinite;
    }

    .hero-chart-svg {
      width: 100%;
      height: 80px;
    }

    .hero-chart-line {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke: url(#chartGradient);
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: lineGrow 6.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes lineGrow {
      0% {
        stroke-dashoffset: 260;
      }
      30% {
        stroke-dashoffset: 180;
      }
      65% {
        stroke-dashoffset: 60;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    .hero-chart-target-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.95);
      color: #fff;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      box-shadow: 0 10px 18px rgba(34, 197, 94, 0.4);
      animation: targetPop 6.2s ease-in-out infinite;
    }

    @keyframes targetPop {
      0%,
      40% {
        transform: translateY(18px);
        opacity: 0;
      }
      50%,
      76% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(18px);
        opacity: 0;
      }
    }

    .notif-timeline {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .notif-step {
      border-radius: 16px;
      padding: 8px 9px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 10px;
      color: #475569;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .notif-step-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: #0f172a;
    }

    .notif-step-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #06b6d4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 9px;
    }

    .notif-step[data-active="true"] {
      border-color: var(--color-primary-alt);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.6);
      background: radial-gradient(circle at top, #ecfeff 0, #ffffff 60%);
      color: #0f172a;
    }

    .notif-step[data-active="true"] .notif-step-icon {
      background: #22c55e;
      transform: scale(1.05);
    }

    .notif-stage-shell {
      transition: transform 0.28s ease, opacity 0.28s ease;
    }

    .notif-stage-shell.stage-transition {
      transform: translateY(-4px);
      opacity: 0;
    }

    .notif-footnote {
      font-size: 10px;
      color: #64748b;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notif-footnote i {
      color: #9ca3af;
    }

    /* layout utilities */
    @media (max-width: 1024px) {
      .hero-visual {
        max-width: 360px;
      }
      .notif-main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .hero-pad {
        padding-top: 3.6rem;
        padding-bottom: 4.2rem;
      }
      .hero-visual {
        margin-top: 30px;
        max-width: none;
      }
      .notif-shell {
        border-radius: 24px;
      }
      .notif-main {
        padding: 12px;
      }
    }
  </style>

</head>

        mobileMenu.classList.remove("open");
        const icon = menuToggle.querySelector("i");
        icon.className = "fa-solid fa-bars text-lg";
      });
    });

    // reveal on scroll
    const revealObserver = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            revealObserver.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12 }
    );

    document.querySelectorAll(".reveal").forEach((el) =>
      revealObserver.observe(el)
    );

    // hero notification state machine (alert -> entry -> target -> note, looping)
    const stages = [
      {
        title: "Advisory Alert: BUY NIFTY CE 24500",
        text:
          "Notification received: BUY NIFTY CE 24500 @ 125, Target 202, Stoploss 104. Trader gets the complete plan with levels and risk.",
        meta: {
          entry: "24500 Call near 125 (±2 pts)",
          target: "202 (partial booking allowed)",
          sl: "104 (strict)"
        },
        chips: [
          "Advisory notification released",
          "Trade plan with logic"
        ],
        activeStep: 0
      },
      {
        title: "Trade Execution: Order Filled Near 125",
        text:
          "Trader executes BUY NIFTY CE 24500 close to 125 as per advisory. Risk per lot is known upfront with stoploss at 104.",
        meta: {
          entry: "Executed around 125 after alert",
          target: "202 target remains active",
          sl: "104 respected as hard stop"
        },
        chips: [
          "User follows advisory levels",
          "Position size aligned with risk"
        ],
        activeStep: 1
      },
      {
        title: "Target Hit: Price Touches 202 Zone",
        text:
          "NIFTY CE 24500 rallies and touches 202 zone. Position is squared off as per advisory target, booking defined profit.",
        meta: {
          entry: "Trade originated near 125",
          target: "Exit near 202 (as per plan)",
          sl: "SL not hit; risk was controlled"
        },
        chips: [
          "Target booked at advisory level",
          "Trade closed exactly as planned"
        ],
        activeStep: 2
      },
      {
        title: "Post-Trade Note: Process Over Outcome",
        text:
          "Trade is reviewed with notes on structure, volatility and behaviour around levels. Focus stays on execution quality and risk discipline.",
        meta: {
          entry: "Review of entry context",
          target: "Understanding of exit behaviour",
          sl: "Reinforcing SL discipline"
        },
        chips: [
          "Learning notes shared",
          "Helps refine future decisions"
        ],
        activeStep: 2
      }
    ];

    const stageShell = document.getElementById("notifStageShell");
    const stageTitle = document.getElementById("notifStageTitle");
    const stageText = document.getElementById("notifStageText");
    const timelineSteps = document.querySelectorAll(".notif-step");

    function applyStage(index) {
      const stage = stages[index];
      if (!stage) return;

      stageShell.classList.add("stage-transition");

      setTimeout(() => {
        stageTitle.textContent = stage.title;
        stageText.innerHTML = stage.text;

        const metaList = stageShell.querySelector(".notif-meta-list");
        if (metaList) {
          metaList.innerHTML = `
            ><span>Entry:</span> ${stage.meta.entry}</l/li>
            ><span>Target:</span> ${stage.meta.target}</l/li>
            ><span>Stoploss:</span> ${stage.meta.sl}</li>
          `;
        }

        const chipRow = stageShell.querySelector(".notif-chip-row");
        if (chipRow) {
          chipRow.innerHTML = "";
          stage.chips.forEach((chipText, idx) => {
            const chip = document.createElement("div");
            chip.className = "notif-chip";
            const icon = document.createElement("i");
            icon.className =
              idx === 0
                ? "fa-solid fa-bell"
                : "fa-solid fa-list-check";
            chip.appendChild(icon);
            const span = document.createElement("span");
            span.textContent = chipText;
            chip.appendChild(span);
            chipRow.appendChild(chip);
          });
        }

        timelineSteps.forEach((stepEl) => {
          const stepIndex = Number(stepEl.dataset.step || 0);
          stepEl.dataset.active =
            stepIndex === stage.activeStep ? "true" : "false";
        });

        stageShell.classList.remove("stage-transition");
      }, 220);
    }

    let stageIndex = 0;
    applyStage(stageIndex);

    setInterval(() => {
      stageIndex = (stageIndex + 1) % stages.length;
      applyStage(stageIndex);
    }, 6000);
  </script>
</body>
</html>
